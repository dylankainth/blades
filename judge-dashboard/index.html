<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judge Dashboard — Twin Negotiations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f0f0f;
            color: #e5e5e5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 16px 20px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        .matches-panel {
            width: 280px;
            background: #141414;
            border-right: 1px solid #333;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .match-item {
            padding: 14px 16px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 150ms;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .match-item:hover {
            background: #1f1f1f;
        }

        .match-item.active {
            background: #2a3a4a;
            border-left: 3px solid #4a9eff;
            padding-left: 13px;
        }

        .match-item-header {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }

        .match-item-status {
            font-size: 12px;
            color: #888;
        }

        .match-item-status.active {
            color: #4a9eff;
        }

        .empty-state {
            padding: 32px 16px;
            text-align: center;
            color: #666;
            font-size: 13px;
        }

        .transcript-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0f0f0f;
            overflow: hidden;
        }

        .transcript-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #555;
            font-size: 14px;
        }

        .transcript-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .transcript-message {
            display: flex;
            gap: 12px;
            animation: slideIn 300ms ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .transcript-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2a3a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #4a9eff;
            flex-shrink: 0;
        }

        .transcript-bubble {
            flex: 1;
        }

        .transcript-speaker {
            font-size: 12px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 4px;
        }

        .transcript-text {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 13px;
            line-height: 1.5;
            color: #e5e5e5;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            word-break: break-word;
        }

        .transcript-reason {
            margin-top: 20px;
            padding: 16px;
            background: linear-gradient(135deg, #1a2a1a 0%, #1a1a2a 100%);
            border-left: 3px solid #4ade80;
            border-radius: 4px;
        }

        .transcript-reason-label {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .transcript-reason-text {
            font-size: 14px;
            line-height: 1.6;
            color: #fff;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f0f0f;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #444;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <h1>🤝 Twin Negotiations — Judge Dashboard</h1>
    </header>

    <div class="container">
        <div class="matches-panel">
            <div id="matchesList"></div>
        </div>
        <div class="transcript-panel">
            <div id="transcriptContent"></div>
        </div>
    </div>

    <script type="module">
        // ============================================================
        // Firebase Configuration
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAMRDIwCL3B4Km3aneTKjiRCF-CFUWQH3E",
            authDomain: "blades-a38f5.firebaseapp.com",
            projectId: "blades-a38f5",
            storageBucket: "blades-a38f5.firebasestorage.app",
            messagingSenderId: "110415722590",
            appId: "1:110415722590:web:48cabe19aec737fe049ccf",
        };

        // ============================================================
        // Firebase SDK Import and Initialization
        // ============================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import {
            getAuth,
            signInAnonymously,
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            onSnapshot,
            query,
            orderBy,
            limit
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Anonymous auth just to satisfy Firestore's "request.auth != null"
        // read rule on matches/{matchId} — this dashboard is read-only and
        // never writes anything, so anonymous is enough. See firestore.rules.
        await signInAnonymously(auth);

        // ============================================================
        // State & DOM
        // ============================================================
        let matches = [];
        let activeMatchId = null;

        const matchesList = document.getElementById("matchesList");
        const transcriptContent = document.getElementById("transcriptContent");

        // ============================================================
        // Firestore Listener Setup
        // ============================================================
        // matches/{matchId} is readable by any signed-in user (see
        // firestore.rules) — the anonymous sign-in above is what satisfies
        // that. Shows every negotiation, confirmed matches and dismissed
        // non-matches alike, which is the point of this dashboard.

        const matchesRef = collection(db, "matches");
        const q = query(matchesRef, orderBy("createdAt", "desc"), limit(50));

        onSnapshot(q, (snapshot) => {
            matches = [];
            snapshot.forEach((doc) => {
                matches.push({
                    id: doc.id,
                    ...doc.data()
                });
            });

            // If no active match is selected, pick the first one
            if (!activeMatchId && matches.length > 0) {
                activeMatchId = matches[0].id;
            }

            renderMatchesList();
            renderTranscript();
        });

        // ============================================================
        // Render Matches List
        // ============================================================
        function renderMatchesList() {
            matchesList.innerHTML = "";

            if (matches.length === 0) {
                matchesList.innerHTML = `<div class="empty-state">Waiting for twin negotiations...</div>`;
                return;
            }

            matches.forEach((match) => {
                const isActive = match.id === activeMatchId;
                const status = match.status || "negotiating";
                const twin1 = match.twinA || "Twin 1";
                const twin2 = match.twinB || "Twin 2";

                const el = document.createElement("div");
                el.className = `match-item ${isActive ? "active" : ""}`;
                el.innerHTML = `
                    <div class="match-item-header">${twin1} <span style="color: #666;">↔</span> ${twin2}</div>
                    <div class="match-item-status ${isComplete(status) ? "" : "active"}">
                        ${isComplete(status) ? (status === "confirmed" ? "✓ Match" : "✕ No match") : '<span class="loading-spinner"></span>Negotiating'}
                    </div>
                `;
                el.addEventListener("click", () => {
                    activeMatchId = match.id;
                    renderMatchesList();
                    renderTranscript();
                });
                matchesList.appendChild(el);
            });
        }

        // ============================================================
        // Render Transcript
        // ============================================================
        function renderTranscript() {
            transcriptContent.innerHTML = "";

            if (!activeMatchId) {
                transcriptContent.innerHTML = `<div class="transcript-placeholder">Select a negotiation to view</div>`;
                return;
            }

            const match = matches.find((m) => m.id === activeMatchId);
            if (!match) {
                transcriptContent.innerHTML = `<div class="transcript-placeholder">Match not found</div>`;
                return;
            }

            const container = document.createElement("div");
            container.className = "transcript-container";

            // Render transcript messages
            const transcript = match.transcript || [];
            transcript.forEach((turn) => {
                const msg = document.createElement("div");
                msg.className = "transcript-message";

                // Backend turns are {speakerTwinId, content}; names live on
                // the match doc (see functions/src/types.ts).
                const speaker =
                    (match.names && match.names[turn.speakerTwinId]) || "Unknown";
                const initials = speaker
                    .split(" ")
                    .map((w) => w[0])
                    .join("")
                    .toUpperCase();

                msg.innerHTML = `
                    <div class="transcript-avatar">${initials}</div>
                    <div class="transcript-bubble">
                        <div class="transcript-speaker">${escapeHtml(speaker)}</div>
                        <div class="transcript-text">${escapeHtml(turn.content || "")}</div>
                    </div>
                `;
                container.appendChild(msg);
            });

            // Render final reason if negotiation is complete
            if (isComplete(match.status) && match.reason) {
                const reasonEl = document.createElement("div");
                reasonEl.className = "transcript-reason";
                reasonEl.innerHTML = `
                    <div class="transcript-reason-label">${match.status === "confirmed" ? "Why They Should Meet" : "Why Not"}</div>
                    <div class="transcript-reason-text">${escapeHtml(match.reason)}</div>
                `;
                container.appendChild(reasonEl);
            }

            if (transcript.length === 0) {
                container.innerHTML = `<div class="transcript-placeholder">No transcript yet</div>`;
            }

            transcriptContent.appendChild(container);
        }

        // ============================================================
        // Utility: Escape HTML
        // ============================================================
        // The backend writes "negotiating" first, then "confirmed" or "dismissed".
        function isComplete(status) {
            return status === "confirmed" || status === "dismissed";
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial render
        renderMatchesList();
        renderTranscript();
    </script>
</body>
</html>
